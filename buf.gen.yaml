version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/tctien342/pig-cursor-sdk/gen
plugins:
  - local: protoc-gen-go
    out: gen
    opt: module=github.com/tctien342/pig-cursor-sdk/gen
  - local: protoc-gen-connect-go
    out: gen
    opt: module=github.com/tctien342/pig-cursor-sdk/gen
inputs:
  - directory: proto
